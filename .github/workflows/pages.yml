# Website → GitHub Pages (https://gnmcool.github.io/bharat-weather-intelligence/).
# The API runs on Vercel (backend/vercel.json); set the repository variable BWI_API_BASE if
# its address differs from the default below.
name: Website (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.BWI_API_BASE || 'https://bharat-weather-intelligence-brown.vercel.app/api/v1' }}
        run: |
          npm ci
          npx vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
