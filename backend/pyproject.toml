[project]
name = "bharat-weather-intelligence"
version = "0.1.0"
description = "Bharat Weather Intelligence — weather → impact → decision platform for India (API + workers)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "shapely>=2.0",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "respx>=0.21"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
# Cloud deployment (Vercel project root = backend/)
entrypoint = "app.main:app"
